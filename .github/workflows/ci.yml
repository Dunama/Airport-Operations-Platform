name: ci

on: [push, pull_request]

jobs:

  api:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airport
          POSTGRES_PASSWORD: airport
          POSTGRES_DB: airport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airport -d airport_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://airport:airport@localhost:5432/airport_test
      TEST_DB_URL: postgresql+asyncpg://airport:airport@localhost:5432/airport_test
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: "30"
      CORS_ORIGINS: '["http://localhost"]'
      REFRESH_TOKEN_MINUTES: "10080"

    defaults:

      run:

        working-directory: apps/api

    steps:

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      - run: uv run pytest
